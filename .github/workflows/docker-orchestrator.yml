name: 🥪 Orchestrator Full CI/CD

on:
  # [ΔΙΟΡΘΩΣΗ ΚΡΙΤΗ #2] Οι πύλες έτρεχαν ΜΟΝΟ στο main. Κάθε κλάδος εργασίας
  # έφτανε στη συγχώνευση ΑΝΕΛΕΓΚΤΟΣ: το «πράσινο CI» ήταν βεβαιότητα για
  # κώδικα που είχε ΗΔΗ μπει, ποτέ για κώδικα που ΕΠΡΟΚΕΙΤΟ να μπει.
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dependency-policy-gate:
    name: Dependency Policy Gate
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@v4

    - name: 🔐 Capture Runtime Closure
      run: |
        sudo apt-get update && sudo apt-get install -y sbcl
        sbcl --script scripts/capture-runtime-closure.lisp

    - name: 🔍 Verify Bijective Closure
      run: |
        # [RATCHET-5] Η ΜΙΑ ΕΔΡΑ ΚΡΙΣΗΣ. Το script αυτό ΔΕΝ ΥΠΗΡΧΕ σε κανένα
        # commit — άρα το job έσκαγε πάντα και ΟΛΑ τα εξαρτώμενα jobs
        # (needs: dependency-policy-gate) δεν έτρεχαν ΠΟΤΕ.
        VERIFY_HASHES=true ./scripts/verify-runtime-closure.sh

    - name: 📋 Check Closure Artifact Unchanged
      run: |
        if git diff --exit-code deps/*.closure.json; then
          echo "✓ Closure artifact is up-to-date"
        else
          echo "⚠️  Closure artifact has changed. Please regenerate and commit:"
          echo "  sbcl --script scripts/capture-runtime-closure.lisp"
          echo "  git add deps/*.closure.json"
          echo "  git commit -m 'Update closure artifact'"
          exit 1
        fi

    # [RATCHET-5] Ο έλεγχος διαχωρισμού στρωμάτων ΜΕΤΑΦΕΡΘΗΚΕ ΜΕΣΑ στην έδρα
    # κρίσης (verify-runtime-closure.sh). Ήταν inline jq πάνω σε artifact που
    # ήταν ΚΕΝΟ ("closure": []) — δηλαδή περνούσε ΤΕΤΡΙΜΜΕΝΑ: jq σε κενό array
    # δεν βρίσκει ποτέ παράβαση. Καμία πολιτική σε YAML· η έδρα φέρει και δικό
    # της αντιπαλικό fixture (scripts/verify-runtime-closure-test.sh).

  ci-integrity-selfcheck:
    name: 🔒 CI integrity self-check (plenary-assessor negative fixture)
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@v4
    - name: 🧰 Toolchain (sbcl/python3/node) — ΡΗΤΗ εγκατάσταση, καμία σιωπηλή υπόθεση
      shell: bash
      run: |
        # [ΔΙΟΡΘΩΣΗ ΚΡΙΤΗ #2] Το job καλούσε `sbcl` ΧΩΡΙΣ να το εγκαταστήσει —
        # τα βήματα Merkle έσκαγαν με "command not found", δηλαδή η πύλη ΔΕΝ
        # έτρεχε ΠΟΤΕ πράσινη. Εδώ εγκαθίσταται ΚΑΙ επαληθεύεται η ύπαρξη κάθε
        # εργαλείου: απόν εργαλείο = ΑΠΟΤΥΧΙΑ ΤΩΡΑ, όχι ψευδο-πράσινο μετά.
        sudo apt-get update && sudo apt-get install -y sbcl
        for t in sbcl python3 node; do
          command -v "$t" >/dev/null || { echo "::error::ΑΠΟΝ εργαλείο: $t"; exit 1; }
          echo "  ✓ $t → $(command -v "$t")"
        done
    - name: 🧨 Prove the gate-plenary assessor fails-closed (crash / incomplete / non-baseline / contradiction)
      shell: bash
      run: |
        # [audit#1] Η ΜΙΑ έδρα κρίσης ολομέλειας δεν γίνεται εμπιστευτή προτού
        # αποδειχθεί ότι απορρίπτει ΚΑΘΕ false-green σενάριο (αρνητικό fixture).
        bash deployment/verify/assess-gate-plenary-test.sh
    - name: 🧨 Prove the standalone-suite runner is derived+fail-closed (no forgotten suite)
      shell: bash
      run: |
        # [audit#2] Η ΜΙΑ έδρα εκτέλεσης suites (filesystem-derived) δεν γίνεται
        # εμπιστευτή προτού αποδειχθεί ότι auto-includes κάθε νέα σουίτα, τιμά τις
        # δηλωμένες εξαιρέσεις, και είναι fail-closed σε αποτυχία/κενό inventory.
        bash docker/run-standalone-suites-test.sh
    - name: 🧨 Prove the runtime-closure seat rejects every false-green
      shell: bash
      run: |
        # [RATCHET-5] Η έδρα κρίσης closure δεν γίνεται εμπιστευτή προτού
        # αποδειχθεί ότι απορρίπτει: κενό closure, test-layer εξάρτηση, σπασμένο
        # αμφιμονοσήμαντο, ασύμφωνο/απόν pin, ελλιπές πεδίο, κατεστραμμένο JSON.
        bash scripts/verify-runtime-closure-test.sh
    - name: 🌳 MERKLE-SINGLE-TRUTH — one canonical Merkle truth
      shell: bash
      run: |
        # [MERKLE-SINGLE-TRUTH] Τα δημόσια κείμενα δίδασκαν duplicate-last
        # (CVE-2012-2459) και το verify/README παρέλειπε τα domain prefixes,
        # ενώ ο κώδικας έκανε το σωστό ⇒ τρίτος που ξανα-υλοποιούσε έπαιρνε
        # ΔΙΑΦΟΡΕΤΙΚΗ ρίζα. Release blocker — τώρα μηχανικά επιβαλλόμενο.
        sbcl --script scripts/gen-merkle-truth.lisp --check     # docs ≡ committed
        sbcl --script scripts/gen-merkle-truth.lisp             # ιδιοπάθεια:
        sbcl --script scripts/gen-merkle-truth.lisp --check     #   2η εκτέλεση = καμία αλλαγή
        python3 deployment/verify/verify-merkle.py
        node deployment/verify/verify-merkle.mjs
        bash scripts/merkle-mutation-witness.sh
    - name: 🧨 Prove the proof-manifest verifier fails-closed (totality + suite census)
      shell: bash
      run: |
        # [RATCHET-5] Το fixture ΥΠΗΡΧΕ αλλά ήταν ΟΡΦΑΝΟ: 0 αναφορές σε CI ή
        # Dockerfile — δηλαδή ο verifier του proof manifest (η πύλη ολότητας)
        # ήταν ο ΜΟΝΟΣ χωρίς αντίπαλο. Τώρα τρέχει.
        python3 docker/verify-proof-manifest-test.py

  authority-v2-boundary:
    name: 🔒 authority-v2 — Merkle seat differential, capture fixed point, OS boundary
    runs-on: ubuntu-latest
    # ΕΥΡΗΜΑ ΔΗΜΙΟΥΡΓΟΥ (P1): «τίποτα δεν είναι συρματωμένο σε Docker/compose/
    # workflow — το HEAD έχει μηδέν Actions runs και μηδέν status checks». ΟΡΘΟ.
    # ΚΑΜΙΑ ΠΟΛΙΤΙΚΗ ΣΕ YAML: το job καλεί ΜΙΑ έδρα (authority-v2/run-proofs.sh)
    # που ΠΑΡΑΓΕΙ το inventory από το filesystem και το συγκρίνει με την
    # committed απογραφή. Νέα απόδειξη ⇒ μπαίνει ΑΥΤΟΜΑΤΑ· ξεχασμένη απόδειξη
    # ⇒ ΣΦΑΛΜΑ. Το YAML δεν ξέρει ονόματα tests και δεν μπορεί να ξεμείνει πίσω.
    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@v4

    - name: 🧰 Toolchain — ΡΗΤΗ εγκατάσταση, καμία σιωπηλή υπόθεση
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y sbcl util-linux python3-yaml
        python3 -c 'import yaml' || { echo '::error::PyYAML ΑΠΩΝ'; exit 1; }
        for t in sbcl python3 setpriv unshare mount; do
          command -v "$t" >/dev/null || { echo "::error::ΑΠΟΝ εργαλείο: $t"; exit 1; }
          echo "  ✓ $t → $(command -v "$t")"
        done

    - name: 🔒 ΟΛΕΣ οι αποδείξεις authority-v2 (BLOCKED ⇒ ΣΦΑΛΜΑ, ποτέ σιωπή)
      shell: bash
      run: |
        # AUTHORITY_V2_REQUIRE_ALL=1: εδώ ο root ΥΠΑΡΧΕΙ, άρα «BLOCKED» δεν είναι
        # τίμια άγνοια — είναι απώλεια δυνατότητας και ΟΦΕΙΛΕΙ να κοκκινίσει.
        # sudo: το OS boundary test απαιτεί CAP_SYS_ADMIN (bind mount) + setpriv.
        sudo env AUTHORITY_V2_REQUIRE_ALL=1 LAWMAX_REPO="$PWD" \
             bash authority-v2/run-proofs.sh

    - name: 🧪 Οι Lisp αποδείξεις αφοπλισμού (ΙΔΙΟΣ πυρήνας, ΜΙΑ φορά χτισμένος)
      shell: bash
      run: |
        CORE="$RUNNER_TEMP/authority-cli.core"
        LAWMAX_REPO="$PWD" sbcl --script authority-v2/tests/build-authority-core.lisp "$CORE"
        [ -s "$CORE" ] || { echo "::error::ο πυρήνας δεν χτίστηκε"; exit 1; }
        rc=0
        for t in tests/level7-disarm-test.lisp \
                 tests/release-authority-test.lisp \
                 tests/transparency-log-test.lisp; do
          echo "▶ $t"
          LAWMAX_REPO="$PWD" sbcl --core "$CORE" --script "$t" || rc=1
        done
        exit $rc

    - name: 📐 Πύλες τιμιότητας — completion matrix + proof manifest
      shell: bash
      run: |
        python3 authority-v2/proofs/verify-completion-matrix.py
        python3 authority-v2/proofs/verify-proof-manifest.py

  verifier-conformance:
    needs: [dependency-policy-gate]
    name: 🔗 Cross-language verifier conformance
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@v4

    - name: 🛣️ Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔗 Prove the public verifiers agree with the canonical implementation
      run: |
        # Builds the gate stage; its RUN step emits a signed corpus from Lisp and
        # verifies it with deployment/verify/{verify.py,verify.mjs}. A mismatch
        # (or a tampered byte slipping through) fails the build.
        docker build --build-arg GIT_COMMIT=${{ github.sha }} --target verifier-conformance --tag orchestrator:verifier-conformance .

  standalone-tests:
    needs: [dependency-policy-gate]
    name: 🧪 Standalone test gate (full suite)
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@v4

    - name: 🛣️ Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🧪 Run the gated standalone tests
      run: |
        # Builds the standalone-test stage. Each tests/*-test.lisp runs under
        # docker/run-standalone-test.lisp and calls (sb-ext:exit 1) on any failed
        # check, so a single failing assertion fails this build — and the CI job.
        docker build --build-arg GIT_COMMIT=${{ github.sha }} --target standalone-test --tag orchestrator:standalone-test .

  build-and-test:
    needs: [dependency-policy-gate, verifier-conformance, standalone-tests, ci-integrity-selfcheck]
    name: 🛠️ Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@v4

    - name: 🛣️ Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 📄 Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: 📆 Build Docker image
      id: build
      run: |
        docker build --build-arg GIT_COMMIT=${{ github.sha }} --cache-from type=local,src=/tmp/.buildx-cache --tag orchestrator:test .
        echo "digest=$(docker inspect orchestrator:test --format='{{.Id}}')" >> $GITHUB_OUTPUT

    - name: 📦 Generate SBOM (supply-chain manifest)
      run: |
        # Install syft
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

        # Generate SBOM in SPDX format
        syft packages orchestrator:test -o spdx-json > sbom.spdx.json

        echo "✓ SBOM generated: sbom.spdx.json"

    - name: 📋 Upload SBOM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: orchestrator-sbom
        path: sbom.spdx.json

    - name: 🏭 FF3 materialization — ΚΑΙ ΤΑ 6 σώματα πριν την ολομέλεια (επιλογή A, καθολική)
      shell: bash          # ρητό bash ⇒ ενεργό pipefail (ο default runner shell ΔΕΝ το έχει)
      run: |
        # Απόφαση δημιουργού [0035] επιλογή A, καθολικευμένη [εντολή 2026-07-21]:
        # «πρέπει να παράγει τα πάντα και να κρίνει επί όλων». Πύλες που χρειάζονται
        # materialized output ΔΕΝ κρίνονται σε μερικό baseline — το pipeline τρέχει
        # ΠΡΑΓΜΑΤΙΚΑ για ΚΑΘΕ υπηρετούμενο σώμα (η ίδια λίστα με *served-corpora*),
        # ώστε ολομέλεια + release/extension gates να κρίνουν ΦΡΕΣΚΙΑ έξοδο 6/6,
        # όχι 1/6 φρέσκια και 5/6 committed ιστορία.
        # [audit#1] FAIL-CLOSED: pipefail + ${PIPESTATUS[0]} — crash του docker ΔΕΝ
        # κρύβεται πλέον πίσω από το exit 0 του `tee`.
        # [κύκλος-2 CRITICAL false-green fix] ΟΧΙ «| tee … || true»: μετά το `|| true` έχει
        # ΗΔΗ εκτελεστεί νέα εντολή (`true`), άρα το PIPESTATUS αντικαθίσταται με (0) —
        # ΑΚΡΙΒΩΣ όταν το docker αποτυγχάνει (αναπαραγόμενο false-green). set +e γύρω από
        # το pipe ⇒ το -e δεν ματαιώνει· PIPESTATUS[0] = ΠΡΑΓΜΑΤΙΚΟ docker exit· set -e ξανά.
        set -o pipefail
        # corpus-id → όνομα φακέλου εξόδου (συνέπεια με +corpus-output-alias+: syntagma→constitution)
        outdir() { case "$1" in syntagma) echo constitution ;; *) echo "$1" ;; esac; }
        for corpus in syntagma poinikos astikos kpolitikis kpoinikis kdioikitikis; do
          set +e
          docker run --rm -v "${{ github.workspace }}":/src -w /src -e LAWMAX_ROOT=/src \
            -e ORCHESTRATOR_OUTPUT_DIR=/src/output -e ORCHESTRATOR_CORPUS="$corpus" \
            orchestrator:test --run-pipeline 2>&1 | tee "materialize-$corpus.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Materialization «$corpus» κατέρρευσε (exit=$status) — μερικό baseline ΔΕΝ γίνεται δεκτό."; exit 1; fi
          d="$(outdir "$corpus")"
          test -d "${{ github.workspace }}/output/$d" || {
            echo "::error::Το materialization ΔΕΝ παρήγαγε output/$d ($corpus)."; exit 1; }
        done

    - name: 🏛️ FF3 AUTHORITATIVE plenary — source-present --gates
      shell: bash          # ρητό bash ⇒ ενεργό pipefail (ο default runner shell ΔΕΝ το έχει)
      run: |
        # Η ΕΓΚΥΡΗ (authoritative) ολομέλεια του FF3. source-present: το checkout
        # mounted ως /src, cwd=/src (-w) ΚΑΙ LAWMAX_ROOT=/src, ώστε ΟΛΕΣ οι πύλες
        # να βλέπουν source + docs (κάποιες πύλες αναλύουν πηγές μέσω getcwd), και
        # με το output/ ΗΔΗ materialized (βήμα A παραπάνω) ώστε το --extension-gate
        # να κριθεί πραγματικά. ΓΝΩΣΤΟ env-only baseline: ΜΟΝΟ το --advisor-gate.
        #
        # [audit#1] Η ΚΡΙΣΗ γίνεται στη ΜΙΑ δοκιμασμένη έδρα assess-gate-plenary.sh
        # (καμία grep-πολιτική στο YAML): pipefail ⇒ ${PIPESTATUS[0]} = ΠΡΑΓΜΑΤΙΚΟ
        # exit του docker (όχι του tee) ⇒ crash/OOM ΔΕΝ γίνεται false-green· η έδρα
        # απαιτεί ΘΕΤΙΚΗ απόδειξη ολοκλήρωσης (σφραγίδα-footer) + μόνο advisor κόκκινο.
        # [κύκλος-2 CRITICAL false-green fix] βλ. materialization: «| tee … || true» μηδενίζει
        # το PIPESTATUS ΑΚΡΙΒΩΣ όταν το docker αποτυγχάνει. set +e/-e ⇒ το `status` είναι το
        # ΠΡΑΓΜΑΤΙΚΟ docker exit που περνά στην ΜΙΑ έδρα κρίσης (assess-gate-plenary.sh).
        set -o pipefail
        set +e
        docker run --rm -v "${{ github.workspace }}":/src -w /src -e LAWMAX_ROOT=/src \
          orchestrator:test --gates 2>&1 | tee gates-source-present.log
        status=${PIPESTATUS[0]}
        set -e
        GATE_BASELINE_EXCEPTIONS="advisor-gate" \
          ./deployment/verify/assess-gate-plenary.sh gates-source-present.log "$status"
        # [κύκλος-2 #7] MACHINE-READABLE canonical authority (συμπληρωματικά στην anchored-footer
        # κρίση): parse του (:gate-plenary/1 …) manifest· ΑΚΡΙΒΗΣ set-equality με το canonical
        # gate-registry.sexp (καμία πύλη λείπει/επιπλέον), κανένα duplicate, ΑΚΡΙΒΩΣ μία ετυμηγορία
        # ανά πύλη, :completed t (απόδειξη ολοκλήρωσης), πραγματικός docker-exit. Τρέχει ΜΕΣΑ στο
        # image (--entrypoint sbcl· self-contained data-only reader, καμία εξάρτηση) με το log
        # mounted. Baseline: advisor-gate (env-only).
        docker run --rm -v "${{ github.workspace }}":/src -w /src --entrypoint sbcl \
          orchestrator:test --script deployment/verify/assess-gate-manifest.lisp \
          gates-source-present.log "$status" deployment/verify/gate-registry.sexp advisor-gate

    - name: 🔎 FF3 verify-truth source-present enforcement (docs ≡ CI)
      run: |
        # docs≡CI, source PRESENT: mount του checkout ως /src + LAWMAX_ROOT=/src,
        # η πύλη διαβάζει τα ΠΡΑΓΜΑΤΙΚΑ docs/CI/Dockerfile (μη-μηδενικό exit = κόκκινο).
        docker run --rm -v "${{ github.workspace }}":/src -w /src -e LAWMAX_ROOT=/src \
          orchestrator:test --verify-truth-gate 2>&1 | tee verify-truth.log
        exit ${PIPESTATUS[0]}

    - name: 🔬 in-image --gates (NON-authoritative minimal-runtime diagnostic)
      continue-on-error: true
      run: |
        # ΔΕΝ είναι authoritative, ΔΕΝ είναι merge proof. Το minimal runtime image ΔΕΝ
        # περιέχει source ούτε pipeline output — άρα πύλες που τα επιθεωρούν
        # (architecture/dialogue/extension/provenance/self-evolution) έχουν ΓΝΩΣΤΟ
        # minimal-runtime baseline. Η authoritative ολομέλεια είναι το source-present
        # βήμα παραπάνω. Εδώ μόνο διαγνωστικό σήμα (non-blocking).
        docker run --rm orchestrator:test --gates 2>&1 | tee gates-inimage-diagnostic.log || true

    - name: 📋 Upload gate plenary logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orchestrator-gates-log
        path: |
          gates-source-present.log
          gates-inimage-diagnostic.log
          verify-truth.log

    - name: 🔎 Smoke test orchestrator loading
      run: |
        docker run --rm orchestrator:test sbcl \
          --noinform --non-interactive \
          --eval '(require :asdf)' \
          --eval '(asdf:load-asd "/app/orchestrator.asd")' \
          --eval '(asdf:load-system :orchestrator)' \
          --eval '(format t "[CI] \\nOrchestrator loaded successfully.\\n")' \
          --quit

    - name: 📂 Upload orchestrator loading log (proof)
      run: |
        echo "[CI] Load successful: $(date)" > load.log
      shell: bash

    - name: 📁 Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: orchestrator-ci-log
        path: load.log

  tag-release:
    name: 🔖 Tag if all tests pass
    runs-on: ubuntu-latest
    needs: [build-and-test, authority-v2-boundary]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@v4

    - name: 🔹 Generate tag name
      id: tag
      run: echo "TAG_NAME=v1.3.${{ github.run_number }}" >> $GITHUB_ENV

    - name: 🔖 Create Git tag
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git tag $TAG_NAME
        git push origin $TAG_NAME

    - name: 🚀 Release created
      run: echo "🌟 Release tag $TAG_NAME pushed successfully"
