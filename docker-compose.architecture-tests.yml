version: '3.8'

services:
  architecture-verification:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: orchestrator-architecture-tests:latest
    container_name: orchestrator-architecture-verification

    # Run architecture verification tests
    command: ["sbcl", "--noinform", "--load", "/workspace/tests/architecture-verification.lisp"]

    volumes:
      - .:/workspace:ro

    working_dir: /workspace

    environment:
      SOURCE_DATE_EPOCH: "1735689600"

    # Exit immediately after tests
    restart: "no"
