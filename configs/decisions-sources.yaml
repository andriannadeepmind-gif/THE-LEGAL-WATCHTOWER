# =============================================================================
# ΠΗΓΕΣ ΝΟΜΟΛΟΓΙΑΣ — endpoints ανά δικαστήριο για το --fetch-decision
# =============================================================================
#
# Κάθε καταχώρηση δίνει ένα url_template με θέσεις {etos} και {arithmos}.
# Η εντολή:   --fetch-decision <tag> <έτος> <αριθμός> [αριθμός…]
# κατεβάζει κάθε απόφαση, τη ρίχνει ΩΣ ΕΧΕΙ στο input/decisions/ και το
# ευφυές intake την αναγνωρίζει από το ίδιο της το κείμενο (δικαστήριο,
# αριθμός/έτος) — δηλαδή ακόμη και το κατεβασμένο περνά από κατανόηση,
# ποτέ από υπόθεση. Αν το κατέβασμα αποτύχει, τυπώνεται η ακριβής curl
# εντολή για χειροκίνητο έλεγχο του endpoint.
#
# ΣΗΜΕΙΩΣΗ: τα κρατικά sites δέχονται αιτήματα μόνο από ελληνικές IP και
# αλλάζουν διαδρομές χωρίς προειδοποίηση — γι' αυτό το endpoint ζει ΕΔΩ
# (μία γραμμή διόρθωση) και όχι μέσα στον κώδικα. Αν το template του ΑΠ
# δεν αποδίδει, άνοιξε μια απόφαση στον browser, αντίγραψε το URL της και
# αντικατέστησε αριθμό/έτος με {arithmos}/{etos}.

courts:
  ap:
    name: "Άρειος Πάγος"
    # Η σελίδα εμφάνισης μιας απόφασης. Ο ΑΛΗΘΙΝΟΣ τύπος (επαληθευμένος σε ζωντανό
    # URL): apof=<αριθμός>_<έτος> (ΚΑΤΩ παύλα, όχι &etos), και ένα token cd=... που
    # το δίνει η σελίδα αναζήτησης — γι' αυτό η ανακάλυψη περνά ΠΑΝΤΑ από το search
    # (ο ΝΟΜΟΛΟΓΟΣ), όχι από κατασκευή URL. Το --fetch-decision το αφήνει κενό.
    url_template: "https://www.areiospagos.gr/nomologia/apofaseis_DISPLAY.asp?cd=&apof={arithmos}_{etos}"
    format: html
    # Το site σερβίρει windows-1253 (ΟΧΙ utf-8). Ο πυρήνας το αποκωδικοποιεί με τον
    # δικό μας ακριβή cp1253 decoder πριν αποθηκεύσει/κατανοήσει.
    encoding: cp1253
    # ── Η ΦΟΡΜΑ ΑΝΑΖΗΤΗΣΗΣ (ο φρουρός νομολογίας) ──────────────────────────────
    # Ολόκληρο το συμβόλαιο της φόρμας ζει ΕΔΩ: αν αλλάξει η σελίδα, διορθώνεις μία
    # γραμμή, ποτέ κώδικα. Ονόματα/κωδικοί από το ίδιο το DOM της apofaseis.asp.
    search:
      url: "https://www.areiospagos.gr/nomologia/apofaseis_result.asp?S=1"
      method: post
      # Χάρτης: λογικό όνομα → όνομα πεδίου στη φόρμα.
      fields:
        chamber: "X_TMHMA"          # 1=Πολιτικές 2=Ποινικές 6=ΟΛΕΣ
        sub_chamber: "X_SUB_TMHMA"  # 1=ΟΛΕΣ 2=Α 13=Α1 12=Α2 3=Β 4=Β1 5=Β2 6=Γ 7=Δ 8=Ε 9=ΣΤ 10=Ζ 11=Ολομ.
        number_op: "X_TELESTIS_number"
        number: "x_number"
        year_op: "X_TELESTIS_ETOS"
        year: "x_ETOS"
      # Οι τελεστές (κοινοί σε αριθμό & έτος): 1='=' 2='>=' 3='<='.
      op_eq: "1"
      op_ge: "2"
      op_le: "3"
      # Κατηγορίες αποφάσεων (X_TMHMA) — ρεύμα cursor ανά κατηγορία.
      chambers:
        all: "6"
        politikes: "1"
        poinikes: "2"
