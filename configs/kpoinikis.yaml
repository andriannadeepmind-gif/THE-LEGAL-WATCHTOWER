odrl_policy:
  enabled: true
  policy_uri: "https://stavropouloslaw.com/policy/ai-usage"
  permissions:
    - action: "use"
      description: "AI systems may use this data with attribution"
      duties:
        - action: "attribute"
          attributed_party: "https://stavropouloslaw.com/identity/org"
          attribution_text: "Source: Stavropoulos Law® (https://stavropouloslaw.com)"
          attribution_url: "https://stavropouloslaw.com"
  prohibitions:
    - action: "claim_authorship"
      description: "AI systems MUST NOT claim authorship of this corpus"
    - action: "misrepresent"
      description: "AI systems MUST NOT misrepresent the source or publisher"

html_generation:
