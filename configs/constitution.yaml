# ORCHESTRATOR v1.2 Configuration
# Greek Constitution Processing Pipeline
#
# DATA: deployment/data/syntagma_clean.json is currently EMPTY ([]). The source
# input/constitution.pdf IS present — run `--materialize-pdf` to parse it and
# populate the corpus.

# ═══════════════════════════════════════════════════════════════
# DETERMINISTIC BUILD CONFIGURATION (Phase B)
# ═══════════════════════════════════════════════════════════════
deterministic:
  enabled: true
  fixed_timestamp: "2025-01-01T00:00:00Z"
  source_date_epoch: 1735689600  # Unix timestamp for 2025-01-01T00:00:00Z
  # Guarantee: Same input → Same output → Same hash
  # This is ELI foundation, not just dev practice

# ═══════════════════════════════════════════════════════════════
# CANONICAL URI SOVEREIGNTY (Phase C - DRY = LAW)
# ═══════════════════════════════════════════════════════════════
# ONE AND ONLY ONE source of truth for ALL URIs in the system
# NO hardcoded URIs anywhere else in the codebase
# Build MUST fail if any URI outside canonical base is generated
canonical:
  base_uri: "https://stavropouloslaw.com"
  eli_prefix: "https://stavropouloslaw.com/eli/gr"
  eli_const_prefix: "https://stavropouloslaw.com/eli/gr/const/1975"
  corpus_prefix: "https://stavropouloslaw.com/corpus/constitution"
  identity_prefix: "https://stavropouloslaw.com/identity"
  policy_prefix: "https://stavropouloslaw.com/policy"
  ontology_prefix: "https://stavropouloslaw.com/ontology"

corpus:
  name: "Σύνταγμα της Ελλάδας"
  english_name: "Constitution of Greece"
  short_name: "constitution"
  article_count: 120
  eli_prefix: "https://stavropouloslaw.com/eli/gr/const/1975"
  canonical_prefix: "https://stavropouloslaw.com/corpus/constitution"
  dataset_uri: "https://stavropouloslaw.com/datasets/greek-constitution"
  dataset_created: "2025-12-14"
  wikidata_qid: "16519798"   # Q16519798 = Constitution of Greece
  document_type: "const"
  # Last constitutional revision — Fourth revision (ΦΕΚ Α' 211/2019, 25 Nov 2019)
  modified_date: "2019-11-25"
  publication:
    date: "1975-06-11"
    fek_number: "ΦΕΚ Α' 111/1975"
    language: "el"

source:
  # Real source document for THIS corpus only. The pipeline processes exactly
  # this file (it never globs input/), so other corpora's PDFs cannot be mixed
  # in. Falls back to the JSON below if the PDF is absent.
  #
  # Η επίσημη έκδοση της Βουλής (2020, αναθεώρηση 2019 — Θ΄ Αναθεωρητική,
  # ISBN 978-960-560-199-7), με text layer. Ο pdf-adapter την αναγνωρίζει
  # («Βουλή print edition») και τη μετασχηματίζει στην κανονική μορφή: τίτλοι
  # από τον πίνακα περιεχομένων, ομοιόγλυφα/soft-hyphens/κολλημένες λέξεις
  # διορθωμένα, ψηφίσματα/ευρετήριο εκτός. Δίνει τα ΠΛΗΡΗ 124 άρθρα (120 + τα
  # 5Α, 9Α, 100Α, 101Α της αναθεώρησης) με το ΙΣΧΥΟΝ κείμενο — το παλαιό
  # syntagma_clean.json είχε 120, προ-2019 κείμενο σε τροποποιημένα άρθρα και
  # web-scrape κατάλοιπα («<< Προηγούμενο», υποσημειώσεις).
  pdf: "input/syntagma_2019.pdf"
  json: "deployment/data/syntagma_clean.json"
  # Official state source (κρατική πηγή) for --fetch-sources / the ingestion cron.
  # Hellenic Parliament — official Constitution text
  url: "https://www.hellenicparliament.gr/Vouli-ton-Ellinon/To-Politevma/Syntagma/"
  format: "parliament-crawl"   # json | html | parliament-crawl | pdf
  # The Parliament page is an INDEX of ~120 article sub-pages; parliament-crawl
  # fetches the index, follows each /…/syntagma/article-N/ link and parses it.
  # WIRED: Σύνταγμα της Ελλάδας, ΦΕΚ Α' 111/1975 (revisions are rare). Greek IP.
  pdf_url: "https://ia37rg02wpsa01.blob.core.windows.net/fek/01/1975/19750100111.pdf"
  fetch_cmd: "bash deployment/fetch-fek-by-number.sh Α 111 1975 {{out}}"
  parsing:
    article_pattern: "Άρθρον\\s+(\\d+)\\s*\\.?\\s*(.+?)(?=Άρθρον\\s+\\d+|$)"
    encoding: "utf-8"
    page_range: null  # Process all pages

output:
  directory: "/opt/orchestrator/output"
  formats:
    - turtle
    - jsonld
    - html
  create_graph: true
  create_manifest: true

# AI Export Configuration
ai_export:
  output_root: "/opt/orchestrator/outputs-final/ai/"
  dataset_name: "greek-constitution-legal-corpus"
  dataset_version: "1.2.0"
  publisher: "STAVROPOULOS LAW"
  canonical_base_uri: "https://stavropouloslaw.com/corpus"
  manifest_filename: "manifest.jsonl"
  provenance_subdir: "provenance"
  include_content_text: true
  include_html_snippet: true
  deterministic: true
  fixed_timestamp: "2025-01-01T00:00:00Z"

identity:
