# ═══════════════════════════════════════════════════════════════
# LEVEL 300: ODRL POLICY (Iron Dome - AI Citation Enforcement)
# ═══════════════════════════════════════════════════════════════
odrl_policy:
  enabled: true
  policy_uri: "https://stavropouloslaw.com/policy/ai-usage"

  # PERMISSIONS
  permissions:
    - action: "use"
      description: "AI systems may use this data with attribution"
      duties:
        - action: "attribute"
          attributed_party: "https://stavropouloslaw.com/identity/org"
          attribution_text: "Source: Stavropoulos Law® (https://stavropouloslaw.com)"
          attribution_url: "https://stavropouloslaw.com"

  # PROHIBITIONS
  prohibitions:
    - action: "claim_authorship"
      description: "AI systems MUST NOT claim authorship of this corpus"
    - action: "misrepresent"
      description: "AI systems MUST NOT misrepresent the source or publisher"

# ═══════════════════════════════════════════════════════════════
# LEVEL 300: HTML + JSON-LD GENERATION (SEO & Knowledge Panel)
# ═══════════════════════════════════════════════════════════════
html_generation:
  enabled: true
  output_directory: "/opt/orchestrator/output/html"

  # JSON-LD SETTINGS
  jsonld:
    include_organization: true
    include_person: true
    include_ceo: true
    include_founder: true
    include_address: true        # Will use placeholders if null
    include_social_proof: true   # LinkedIn, Twitter, etc.

  # RDFa SETTINGS
  rdfa:
    vocabulary: "http://data.europa.eu/eli/ontology#"
    schema_org: true
    open_graph: true
    twitter_card: true

  # SEO SETTINGS
  seo:
    canonical_base: "https://stavropouloslaw.com/eli/gr/const/1975/art"
    robots: "index, follow"
    sitemap_priority: 0.8
    sitemap_changefreq: "monthly"

blockchain:
  ethereum:
    enabled: true
    network: "mainnet"
    contract_address: null  # Will use default anchoring contract
    gas_limit: 100000
    
  arweave:
    enabled: true
    gateway: "https://arweave.net"
    
  ipfs:
    enabled: true
    api: "/ip4/127.0.0.1/tcp/5001"
    gateway: "https://ipfs.io"

validation:
  shacl_shapes: "/opt/orchestrator/deployment/shapes/eli-shapes.ttl"
  strict_mode: true
  report_format: "turtle"

# DEPRECATED: Jinja2 templates removed - all output now generated by native Lisp
# templates:
#   directory: "/opt/orchestrator/deployment/templates"
#   html_template: "article.html.jinja2"
#   manifest_template: "manifest.ttl.jinja2"

telemetry:
  enabled: true
  endpoint: "https://telemetry.stavropouloslaw.com/beacon"
  include_referrer: true
  track_ai_systems: true

qes:
  enabled: false  # Set to true when hardware token connected
  pkcs11_module: "/usr/lib/opensc-pkcs11.so"
  certificate_id: "01"
  hash_algorithm: "SHA256"

monitoring:
  prometheus_enabled: true
  prometheus_port: 9090
  log_level: "INFO"
  log_file: "/opt/orchestrator/logs/orchestrator.log"

performance:
  parallel_processing: true
  worker_count: 4
  batch_size: 10
  cache_enabled: true
  redis_url: "redis://redis:6379/0"

api:
  enabled: true
  port: 8081
  cors_origins: 
    - "https://stavropouloslaw.com"
    - "http://localhost:3000"
  rate_limit: 100  # requests per minute

provenance:
  authority_uri: "http://data.stavropouloslaw.com/agent/greek-parliament"
  authority_label: "Ελληνική Βουλή"

versioning:
  track_amendments: true
  # ═══════════════════════════════════════════════════════════════
  # ELI TEMPORAL COMPLETENESS (Phase D)
  # Source of truth for all amendments, article-level temporal metadata
  # ═══════════════════════════════════════════════════════════════
  amendments:
    - id: "1986"
      date: "1986-03-11"
      date_applicability: "1986-03-11"
      fek: "ΦΕΚ Α' 35/1986"
      description: "First constitutional revision"
      articles_amended: [16, 28, 37, 44, 47, 100, 101, 102, 103, 104, 107, 108, 110, 111]
      articles_repealed: []
    - id: "2001"
      date: "2001-04-17"
      date_applicability: "2001-04-17"
      fek: "ΦΕΚ Α' 85/2001"
      description: "Second constitutional revision"
      articles_amended: [3, 4, 5, 6, 7, 8, 9, 12, 13, 14, 16, 19, 20, 21, 22, 25, 26, 28, 29, 32, 36, 37, 38, 41, 44, 47, 50, 51, 52, 70, 80, 81, 84, 86, 101, 102]
      articles_repealed: []
    - id: "2008"
      date: "2008-05-27"
      date_applicability: "2008-05-27"
      fek: "ΦΕΚ Α' 102/2008"
      description: "Third constitutional revision"
      articles_amended: [14, 16, 23, 24, 86]
      articles_repealed: []
    - id: "2019"
      date: "2019-11-25"
      date_applicability: "2019-11-25"
      fek: "ΦΕΚ Α' 211/2019"
      description: "Fourth constitutional revision"
      articles_amended: [3, 4, 5, 7, 9, 11, 12, 13, 14, 15, 16, 21, 22, 32, 64, 65, 73, 74, 80, 86, 101, 103, 120]
      articles_repealed: []

# Article-level temporal status - defaults for articles not in amendment lists
article_defaults:
  in_force: true
  date_applicability: "1975-06-11"  # Original constitution publication date

deployment:
  target: "production"
  cdn_enabled: true
  cloudflare_zone: ${CLOUDFLARE_ZONE_ID}
  cloudflare_api_key: ${CLOUDFLARE_API_KEY}
  purge_cache: true
  update_sitemap: true
