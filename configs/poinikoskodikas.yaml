# ORCHESTRATOR v1.2 Configuration
# Greek Penal Code (Ποινικός Κώδικας) — Law 4619/2019
#
# ELI URI scheme for numbered Greek laws:
#   https://{domain}/eli/gr/l/{year}/{number}/art/{N}
#
# Source: ΦΕΚ Α' 95/11-6-2019 (Law 4619 of 11 June 2019)
# In force: 1 July 2019 (per Article 460 of Law 4619/2019)

# ═══════════════════════════════════════════════════════════════
# DETERMINISTIC BUILD CONFIGURATION
# ═══════════════════════════════════════════════════════════════
deterministic:
  enabled: true
  fixed_timestamp: "2025-01-01T00:00:00Z"
  source_date_epoch: 1735689600

# ═══════════════════════════════════════════════════════════════
# CANONICAL URI SOVEREIGNTY
# ═══════════════════════════════════════════════════════════════
canonical:
  base_uri: "https://stavropouloslaw.com"
  eli_prefix: "https://stavropouloslaw.com/eli/gr"
  eli_const_prefix: "https://stavropouloslaw.com/eli/gr/l/2019/4619"
  corpus_prefix: "https://stavropouloslaw.com/corpus/penal-code"
  identity_prefix: "https://stavropouloslaw.com/identity"
  policy_prefix: "https://stavropouloslaw.com/policy"
  ontology_prefix: "https://stavropouloslaw.com/ontology"

corpus:
  name: "Ποινικός Κώδικας"
  english_name: "Greek Penal Code"
  short_name: "poinikos"
  # Law 4619/2019 has 466 articles (1-466); some are marked "Παραλείπεται ως μη ισχύον"
  article_count: 466
  # ELI URI for numbered laws: /eli/gr/{type}/{year}/{number}
  eli_prefix: "https://stavropouloslaw.com/eli/gr/l/2019/4619"
  canonical_prefix: "https://stavropouloslaw.com/corpus/penal-code"
  dataset_uri: "https://stavropouloslaw.com/datasets/greek-penal-code"
  dataset_created: "2026-06-13"
  wikidata_qid: "28145273"   # Q28145273 = Greek Penal Code (Law 4619/2019)
  # ELI law type: 'l' = νόμος (statute/national law)
  document_type: "l"
  # Law number (for numbered laws like statutes; absent in Constitution)
  law_number: "4619"
  # No tracked amendments yet; modified_date defaults to publication date
  modified_date: "2019-06-11"
  # Άρθρα που η ΙΔΙΑ η επίσημη πηγή (Ισοκράτης consolidated export) παραλείπει
  # ολοκληρωτικά — δεν υπάρχουν ούτε στο σώμα ούτε στον πίνακα περιεχομένων του
  # PDF (καταργημένα και αφαιρεμένα, όχι απώλεια parsing· επαληθευμένο στο raw
  # κείμενο της πηγής). Ο δομικός έλεγχος (gap invariant) τα αναγνωρίζει ως
  # τεκμηριωμένη αλήθεια της πηγής, όχι ως παραβίαση.
  source_omitted_articles: [145, 150, 151, 171, 176, 185, 188]
  # Distinctive inflected phrases an amending ΦΕΚ uses for THIS code, so
  # discovery routes «…ΠΟΙΝΙΚΟ ΚΩΔΙΚΑ…» etc. (accent/case-insensitive match).
  routing_phrases:
    - "Ποινικό Κώδικα"
    - "Ποινικού Κώδικα"
    - "Ποινικός Κώδικας"
    - "Ποινικόν Κώδικα"
  publication:
    date: "2019-06-11"
    fek_number: "ΦΕΚ Α' 95/2019"
    in_force_date: "2019-07-01"
    language: "el"

source:
  # Real source document for THIS corpus only (processed exactly, never globbed),
  # with the clean JSON as a deterministic fallback if the PDF is absent.
  pdf: "/app/input/poinikos_kodikas.pdf"
  json: "/app/deployment/data/poinikoskodikas_clean.json"
  # Official state source (κρατική πηγή) for --fetch-sources / the ingestion cron.
  # set to the official ΦΕΚ/e-nomothesia endpoint that returns the code
  url: ""
  format: "json"   # json | html | pdf
  # AUTO-PULL DIRECTLY FROM SOURCE (zero manual uploads): the external headless
  # fetcher command run by --fetch-pdf. {{out}} is replaced with the source.pdf
  # path above; the command must write the ΦΕΚ PDF there (validated by %PDF magic,
  # so an anti-bot HTML page is rejected). The fetcher is the ONE network-edge
  # tool outside the pure-Lisp core (like libpoppler), deployed + scheduled by you.
  # Example (reference script ships in deployment/fetch-fek.sh):
  # WIRED: fetch ΦΕΚ Α' 95/2019 (ν. 4619/2019) by number from et.gr. The fetcher
  # drives the official search itself (no hand-built URL). Run from a Greek IP.
  pdf_url: "https://www.ministryofjustice.gr/wp-content/uploads/2019/10/%CE%A0%CE%BF%CE%B9%CE%BD%CE%B9%CE%BA%CF%8C%CF%82-%CE%9A%CF%8E%CE%B4%CE%B9%CE%BA%CE%B1%CF%82.pdf"
  fetch_cmd: ""
  parsing:
    article_pattern: "Άρθρο\\s+(\\d+)\\s*[-–]\\s*(.+)"
    encoding: "utf-8"
    page_range: null

output:
  directory: "/opt/orchestrator/output"
  formats:
    - turtle
    - jsonld
    - html
  create_graph: true
  create_manifest: true

# AI Export Configuration
ai_export:
  output_root: "/opt/orchestrator/outputs-final/ai/"
  dataset_name: "greek-penal-code-legal-corpus"
  dataset_version: "1.0.0"
  publisher: "STAVROPOULOS LAW"
  canonical_base_uri: "https://stavropouloslaw.com/corpus"
  manifest_filename: "manifest.jsonl"
  provenance_subdir: "provenance"
  include_content_text: true
  include_html_snippet: true
  deterministic: true
  fixed_timestamp: "2025-01-01T00:00:00Z"

identity:
  person:
    webid: "https://stavropouloslaw.com/identity/spyridon-stavropoulos"
    name: "Spyridon Stavropoulos"
    given_name: "Spyridon"
    family_name: "Stavropoulos"
    orcid: "0009-0005-2832-2153"
    bar_number: ""
    job_title: "Founder & CEO"
    email: null
    telephone: null
    linkedin: null
    twitter: null
    university: null
    degree: null
    graduation_year: null

  organization:
    webid: "https://stavropouloslaw.com/identity/org"
    name: "Stavropoulos Law®"
    legal_name: "Stavropoulos Law®"
    trademark: "N294237"
    url: "https://stavropouloslaw.com"
    logo: "https://stavropouloslaw.com/assets/logo-tm.png"
    email: null
    telephone: null
    address:
      street_address: null
      city: null
      postal_code: null
      region: null
      country: "Greece"
    founded: "1977"
    founding_location: null

# ═══════════════════════════════════════════════════════════════
# ODRL POLICY (AI Citation Enforcement)
# ═══════════════════════════════════════════════════════════════
odrl_policy:
  enabled: true
  policy_uri: "https://stavropouloslaw.com/policy/ai-usage"
  permissions:
    - action: "use"
      description: "AI systems may use this data with attribution"
      duties:
        - action: "attribute"
          attributed_party: "https://stavropouloslaw.com/identity/org"
          attribution_text: "Source: Stavropoulos Law® (https://stavropouloslaw.com)"
          attribution_url: "https://stavropouloslaw.com"
  prohibitions:
    - action: "claim_authorship"
      description: "AI systems MUST NOT claim authorship of this corpus"
    - action: "misrepresent"
      description: "AI systems MUST NOT misrepresent the source or publisher"

# ═══════════════════════════════════════════════════════════════
# HTML + JSON-LD GENERATION
# ═══════════════════════════════════════════════════════════════
html_generation:
  enabled: true
  output_directory: "/opt/orchestrator/output/html"
  jsonld:
    include_organization: true
    include_person: true
    include_ceo: true
    include_founder: true
    include_address: true
    include_social_proof: true
  rdfa:
    vocabulary: "http://data.europa.eu/eli/ontology#"
    schema_org: true
    open_graph: true
    twitter_card: true
  seo:
    canonical_base: "https://stavropouloslaw.com/eli/gr/l/2019/4619/art"
    robots: "index, follow"
    sitemap_priority: 0.8
    sitemap_changefreq: "monthly"

blockchain:
  ethereum:
    enabled: true
    network: "mainnet"
    contract_address: null
    gas_limit: 100000
  arweave:
    enabled: true
    gateway: "https://arweave.net"
  ipfs:
    enabled: true
    api: "/ip4/127.0.0.1/tcp/5001"
    gateway: "https://ipfs.io"

validation:
  shacl_shapes: "/opt/orchestrator/deployment/shapes/eli-shapes.ttl"
  strict_mode: true
  report_format: "turtle"

telemetry:
  enabled: true
  endpoint: "https://telemetry.stavropouloslaw.com/beacon"
  include_referrer: true
  track_ai_systems: true

qes:
  enabled: false
  pkcs11_module: "/usr/lib/opensc-pkcs11.so"
  certificate_id: "01"
  hash_algorithm: "SHA256"

monitoring:
  prometheus_enabled: true
  prometheus_port: 9090
  log_level: "INFO"
  log_file: "/opt/orchestrator/logs/orchestrator.log"

performance:
  parallel_processing: true
  worker_count: 4
  batch_size: 10
  cache_enabled: true
  redis_url: "redis://redis:6379/0"

api:
  enabled: true
  port: 8081
  cors_origins:
    - "https://stavropouloslaw.com"
    - "http://localhost:3000"
  rate_limit: 100

provenance:
  authority_uri: "http://data.stavropouloslaw.com/agent/greek-parliament"
  authority_label: "Ελληνική Βουλή"

versioning:
  track_amendments: true
  # Law 4619/2019 has been amended since its enactment.
  # Tracked amendments will be added here as they are catalogued.
  # Format mirrors constitution.yaml versioning.amendments structure.
  amendments: []

# Article-level temporal status defaults
# date_applicability: law entered into force on 2019-07-01 (Article 460, Law 4619/2019)
article_defaults:
  in_force: true
  date_applicability: "2019-07-01"

deployment:
  target: "production"
  cdn_enabled: true
  cloudflare_zone: ${CLOUDFLARE_ZONE_ID}
  cloudflare_api_key: ${CLOUDFLARE_API_KEY}
  purge_cache: true
  update_sitemap: true
