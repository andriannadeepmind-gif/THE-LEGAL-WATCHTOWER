# ==============================================================================
# METRIC DEFINITIONS
# ==============================================================================

# Custom metrics exposed by the application:

# legal_corpus_citations_total
#   Type: Counter
#   Help: Total number of citations detected
#   Labels: article, ai_system, citation_type, confidence
#
# legal_corpus_citation_velocity
#   Type: Gauge  
#   Help: Current citation velocity (citations per hour)
#   Labels: window (1h, 1d, 1w)
#
# beacon_triggers_total
#   Type: Counter
#   Help: Total beacon trigger events
#   Labels: beacon_id, beacon_type
#
# beacon_views_total
#   Type: Counter
#   Help: Total beacon view events
#   Labels: beacon_id
#
# beacon_effectiveness
#   Type: Gauge
#   Help: Beacon effectiveness ratio (0-1)
#   Labels: beacon_id, beacon_type
#
# ai_observer_status
#   Type: Gauge
#   Help: AI observer status (1=active, 0=inactive)
#   Labels: ai_system, observer_id
#
# citation_confidence_score
#   Type: Histogram
#   Help: Distribution of citation confidence scores
#   Buckets: 0.5, 0.7, 0.8, 0.9, 0.95, 1.0
#
# citation_processing_duration
#   Type: Histogram
#   Help: Time taken to process citation events
#   Buckets: 0.01, 0.05, 0.1, 0.5, 1, 5

# ==============================================================================
# GRAFANA DASHBOARD QUERIES
# ==============================================================================

# Example queries for Grafana dashboards:
#
# Total Citations:
#   sum(legal_corpus_citations_total)
#
# Citation Rate:
#   rate(legal_corpus_citations_total[5m])
#
# Citations by Article:
#   sum by (article) (legal_corpus_citations_total)
#
# Citations by AI System:
#   sum by (ai_system) (legal_corpus_citations_total)
#
# Beacon Effectiveness:
#   beacon_effectiveness
#
# Citation Velocity Trend:
#   citation_velocity_ma_24h
#
# Top Cited Articles (last 24h):
#   topk(10, sum by (article) (rate(legal_corpus_citations_total[24h])))
#
# AI System Activity:
#   sum by (ai_system) (rate(legal_corpus_citations_total[1h]))
#
# Citation Confidence Distribution:
#   histogram_quantile(0.95, citation_confidence_score)

