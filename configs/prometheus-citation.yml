# ==============================================================================
# PROMETHEUS CONFIGURATION - AI Citation Velocity Monitoring
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    corpus: 'greek_constitution'
    environment: 'production'
    monitor: 'citation_velocity'

# ==============================================================================
# ALERTING CONFIGURATION
# ==============================================================================

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

# ==============================================================================
# SCRAPE CONFIGURATIONS
# ==============================================================================

scrape_configs:
  
  # Citation Beacon Metrics
  - job_name: 'citation_beacons'
    static_configs:
      - targets: ['localhost:8080']
        labels:
          service: 'orchestrator'
          component: 'beacon'
    
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'legal_corpus_citations.*'
        action: keep
  
  # AI Observer Metrics
  - job_name: 'ai_observers'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'observer-openai:9090'
          - 'observer-anthropic:9090'
          - 'observer-google:9090'
          - 'observer-microsoft:9090'
        labels:
          service: 'ai_observer'
    
    metric_relabel_configs:
      - source_labels: [ai_system]
        target_label: ai_provider
  
  # Velocity Tracker
  - job_name: 'velocity_tracker'
    scrape_interval: 60s
    static_configs:
      - targets: ['localhost:9091']
        labels:
          service: 'velocity'
          component: 'tracker'
  
  # MongoDB Exporter (for citation storage)
  - job_name: 'mongodb'
    static_configs:
      - targets: ['localhost:9216']
        labels:
          service: 'mongodb'
          database: 'citations'

