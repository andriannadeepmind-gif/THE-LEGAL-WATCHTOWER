version: '3.8'

services:
  test-escape-sequences:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: orchestrator-test:latest
    container_name: orchestrator-escape-tests

    # Override command to run tests instead of main pipeline
    command: ["sbcl", "--load", "/workspace/run-tests-docker.lisp"]

    volumes:
      - .:/workspace:ro

    working_dir: /workspace

    environment:
      SOURCE_DATE_EPOCH: "1735689600"

    # Exit immediately after tests
    restart: "no"
