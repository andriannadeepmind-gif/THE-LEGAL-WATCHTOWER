services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_DATE=${BUILD_DATE:-2025-12-15T13:58:00Z}
        - GIT_COMMIT=${GIT_COMMIT:-dev}
        - VERSION=${VERSION:-1.2.0}
      target: runtime
    image: orchestrator:latest
    container_name: orchestrator-main
    # ΤΑΥΤΟΤΗΤΑ: lawmax-producer (ΚΑΡΦΩΜΕΝΟ uid — authority-v2/capability/identities.sh)
    user: "11002:11002"

    # Παράγει ΟΛΟΥΣ τους κώδικες σε ΕΝΑ container/process (η ΜΙΑ έδρα
    # run-all-pipelines): κάθε κώδικας απομονωμένος στο output/<code>/, με
    # τελικό summary. Αντικαθιστά τον εύθραυστο εξωτερικό βρόχο που ξαναέφτιαχνε
    # container ανά κώδικα (6× recreate ⇒ εξάντληση Docker Desktop). Για έναν
    # μόνο κώδικα: docker compose run --rm orchestrator --run-pipeline.
    command: ["--run-all-pipelines"]

    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL

    # Resource limits
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0

    # No host port: this is a one-shot pipeline run. The long-running
    # corpus-service below owns host port 8080.

    volumes:
      # Input/Output (read-write)
      - ./input:/app/input:rw
      # [ΕΤΥΜΗΓΟΡΙΑ ΔΗΜΙΟΥΡΓΟΥ P0] Ήταν `./output:/app/output:rw` — ΟΛΟ το output,
      # μαζί με ΚΑΘΕ releases/, εγγράψιμο. Η ασφαλής διαδρομή υπήρχε (service
      # `producer`) αλλά ΔΕΝ ήταν η ΜΟΝΑΔΙΚΗ δυνατή. Τώρα ΚΑΘΕ service με το
      # runtime image έχει ΤΗΝ ΙΔΙΑ τοπολογία: output ΟΛΟΚΛΗΡΟ read-only,
      # εγγράψιμα ΜΟΝΟ τα candidates/<corpus>.
      - ./output:/app/output:ro
      - ./output/astikos/candidates:/app/output/astikos/candidates:rw
      - ./output/constitution/candidates:/app/output/constitution/candidates:rw
      - ./output/kdioikitikis/candidates:/app/output/kdioikitikis/candidates:rw
      - ./output/kpoinikis/candidates:/app/output/kpoinikis/candidates:rw
      - ./output/kpolitikis/candidates:/app/output/kpolitikis/candidates:rw
      - ./output/poinikos/candidates:/app/output/poinikos/candidates:rw
      - ./logs:/app/logs:rw

      # Configurations (read-only)
      - ./configs:/app/configs:ro

      # Deployment data — RW: --materialize-pdf persists each code's clean source.json
      # here (the materialised real text). The bind mount writes through to ./deployment
      # on the host, so the populated JSON lands in the repo for commit. corpus-service
      # below keeps this :ro (serving never writes).
      - ./deployment:/app/deployment:rw

      # Auto-generated crypto keys (Pure Lisp via Ironclad)
      # [ΕΤΥΜΗΓΟΡΙΑ ΔΗΜΙΟΥΡΓΟΥ] Ιδιωτικά κλειδιά ΠΟΤΕ εγγράψιμα από παραγωγό.
      - ./keys:/app/keys:ro

    environment:
      ORCHESTRATOR_OUTPUT_DIR: /app/output
      ORCHESTRATOR_LOG_DIR: /app/logs
      ORCHESTRATOR_CONFIG_DIR: /app/configs
      ORCHESTRATOR_LOG_LEVEL: ${ORCHESTRATOR_LOG_LEVEL:-info}
      ORCHESTRATOR_WORKERS: ${ORCHESTRATOR_WORKERS:-4}
      ORCHESTRATOR_DEV_MODE: ${ORCHESTRATOR_DEV_MODE:-1}
      PRIVATE_KEY_PATH: /app/keys/private.pem
      # Corpus selection: 'syntagma' (default) or 'poinikos'
      # To run Ποινικός Κώδικας: set ORCHESTRATOR_CORPUS=poinikos before docker compose up
      ORCHESTRATOR_CORPUS: ${ORCHESTRATOR_CORPUS:-syntagma}
      ORCHESTRATOR_JSON_PATH: ${ORCHESTRATOR_JSON_PATH:-}

      # Optional: External service configuration
      # Uncomment and configure as needed
      # ETHEREUM_NETWORK: ${ETHEREUM_NETWORK:-mainnet}
      # ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL}
      # ARWEAVE_WALLET: ${ARWEAVE_WALLET}
      # IPFS_API: ${IPFS_API:-/ip4/127.0.0.1/tcp/5001}

    healthcheck:
      # ΣΗΜΑΣΙΟΛΟΓΙΚΗ ετοιμότητα: το αρχείο το γράφει ο ΙΔΙΟΣ ο orchestrator
      # στο τέλος επιτυχούς pipeline (write-health-file) — όχι ο wrapper στην
      # εκκίνηση. start_period μεγάλο: το pipeline παίρνει λεπτά.
      test: ["CMD-SHELL", "test -f /app/output/.healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

    networks:
      - orchestrator-net

    # DNS servers for external TSA access
    dns:
      - 8.8.8.8
      - 8.8.4.4

    # Run once and stop (pipeline is one-shot, not a daemon)
    restart: "no"

  # ──────────────────────────────────────────────────────────────────────────
  # AI-first MULTI-corpus HTTP service (long-running). Serves EVERY legal code,
  # each under its own /<corpus>/ prefix, with a shared top-level catalog:
  # content-negotiated Akoma Ntoso / RDF / JSON-LD / JSONL, per-article JSON,
  # robots.txt and /.well-known/ai-corpus.json.
  #   docker compose up corpus-service   →   http://localhost:8080/catalog.jsonld
  #     http://localhost:8080/poinikos/corpus.jsonl
  #     http://localhost:8080/constitution/corpus.jsonl
  # ──────────────────────────────────────────────────────────────────────────
  corpus-service:
    # ΜΙΑ έδρα build: ΜΟΝΟ το service `orchestrator` χτίζει το image — αυτό εδώ
    # το ΞΑΝΑΧΡΗΣΙΜΟΠΟΙΕΙ (δικό του build: στανζα = δεύτερο build χωρίς
    # GIT_COMMIT arg ⇒ η fail-closed πύλη του Dockerfile το σκοτώνει, σωστά).
    image: orchestrator:latest
    container_name: orchestrator-corpus-service
    # ΤΑΥΤΟΤΗΤΑ: lawmax-reader (11003) — serving· ΚΑΜΙΑ εγγραφή σε output/keys.
    user: "11003:11003"
    command: ["--serve"]
    depends_on:
      - orchestrator          # reuse the built image
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g          # Φάση 0: χώρος για το ρητό SBCL heap (3.5g) + λειτουργικό
    cpus: 1.0
    ports:
      - "${CORPUS_SERVICE_PORT:-8080}:8080"
    volumes:
      - ./configs:/app/configs:ro
      - ./deployment:/app/deployment:ro
      # Η ΚΑΤΑΣΤΑΣΗ ΤΟΥ ΕΑΥΤΟΥ (μνήμη επεισοδίων, βιογραφία, προτάσεις,
      # στιγμιότυπο γράφου) ΕΠΙΒΙΩΝΕΙ επανεκκινήσεων: μόνο το self εγγράψιμο,
      # όλα τα άλλα (configs, δεδομένα, κείμενα νόμων) μένουν προστατευμένα.
      - ./deployment/self:/app/deployment/self:rw
      # [0086]/Φ6: το corpus-service είναι ο ΜΟΝΑΔΙΚΟΣ ΣΥΓΓΡΑΦΕΑΣ-ΑΥΘΕΝΤΙΑ των
      # version-graph journals — η έκδοση ταυτότητας απαιτεί Persistence Receipt
      # (durable εγγραφή)· χωρίς rw εδώ το serve σωστά αρνείται να ξεκινήσει.
      - ./deployment/data/version-graph:/app/deployment/data/version-graph:rw
      - ./output:/app/output:ro
    environment:
      PORT: 8080
      CORPUS_BASE_URI: ${CORPUS_BASE_URI:-https://stavropouloslaw.com/eli}
      ORCHESTRATOR_CORPUS: ${ORCHESTRATOR_CORPUS:-poinikos}
    networks:
      - orchestrator-net
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # Φάση 6 — ΑΝΤΙΓΡΑΦΑ ΑΝΑΓΝΩΣΗΣ: N stateless αναγνώστες πίσω από εξισορροπητή.
  # LAWMAX_REPLICA=1 ⇒ τα ημερολόγια είναι ΕΦΗΜΕΡΑ (μόνο μνήμη) και το /decide
  # απαντά 403 — ένας μοναδικός συγγραφέας-αυθεντία (το corpus-service παραπάνω).
  # Ενεργοποίηση: ξεσχολίασε και δώσε --scale corpus-replica=N ή replicas.
  # corpus-replica:
  #   image: orchestrator:latest
  #   command: ["--serve"]
  #   depends_on: [corpus-service]
  #   security_opt: ["no-new-privileges:true"]
  #   cap_drop: [ALL]
  #   mem_limit: 4g
  #   cpus: 1.0
  #   ports:
  #     - "8081-8089:8080"
  #   volumes:
  #     - ./configs:/app/configs:ro
  #     - ./deployment:/app/deployment:ro
  #     - ./output:/app/output:ro
  #   environment:
  #     PORT: 8080
  #     LAWMAX_REPLICA: "1"
  #     CORPUS_BASE_URI: ${CORPUS_BASE_URI:-https://stavropouloslaw.com/eli}
  #   networks: [orchestrator-net]
  #   restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # Live ingestion daemon (long-running): polls Diavgeia for newly published
  # acts, re-consolidates, and re-emits the consumption artifacts to ./output,
  # which the corpus-service serves. Needs outbound network access.
  # ──────────────────────────────────────────────────────────────────────────
  ingestion:
    image: orchestrator:latest
    user: "11002:11002"
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: orchestrator-ingestion
    command: ["--run-ingestion"]
    depends_on:
      - orchestrator
    profiles: ["ingestion"]     # opt-in: docker compose --profile ingestion up
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - ./configs:/app/configs:ro
      - ./deployment:/app/deployment:ro
      - ./deployment/self:/app/deployment/self:rw
      # [P0] ίδια τοπολογία με τον producer: output ro, μόνο candidates rw
      - ./output:/app/output:ro
      - ./output/astikos/candidates:/app/output/astikos/candidates:rw
      - ./output/constitution/candidates:/app/output/constitution/candidates:rw
      - ./output/kdioikitikis/candidates:/app/output/kdioikitikis/candidates:rw
      - ./output/kpoinikis/candidates:/app/output/kpoinikis/candidates:rw
      - ./output/kpolitikis/candidates:/app/output/kpolitikis/candidates:rw
      - ./output/poinikos/candidates:/app/output/poinikos/candidates:rw
    environment:
      ORCHESTRATOR_OUTPUT_DIR: /app/output
      ORCHESTRATOR_CORPUS: ${ORCHESTRATOR_CORPUS:-poinikos}
      INGEST_INTERVAL: ${INGEST_INTERVAL:-3600}
    networks:
      - orchestrator-net
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  # Optional: PostgreSQL database
  # Uncomment if needed for future persistence features
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: orchestrator-db
  #   security_opt:
  #     - no-new-privileges:true
  #   environment:
  #     POSTGRES_DB: orchestrator
  #     POSTGRES_USER: orchestrator
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U orchestrator"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - orchestrator-net
  #   restart: unless-stopped

  # Optional: Redis cache
  # Uncomment if needed for caching/queuing
  # redis:
  #   image: redis:7-alpine
  #   container_name: orchestrator-cache
  #   security_opt:
  #     - no-new-privileges:true
  #   command: redis-server --appendonly yes
  #   volumes:
  #     - redis-data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - orchestrator-net
  #   restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # producer — Η ΠΡΑΓΜΑΤΙΚΗ ΠΑΡΑΓΩΓΙΚΗ ΤΟΠΟΛΟΓΙΑ ΤΟΥ ΜΗ ΕΜΠΙΣΤΟΥ ΠΑΡΑΓΩΓΟΥ
  # ═══════════════════════════════════════════════════════════════════════════
  # ΕΤΥΜΗΓΟΡΙΑ ΔΗΜΙΟΥΡΓΟΥ: «Η πραγματική υπηρεσία εξακολουθεί να έχει ολόκληρο
  # το output ως rw και δεν ορίζει producer UID. Το authority-v2-proofs είναι
  # μόνο προνομιούχος εκτελεστής tests, όχι παραγωγική τοπολογία.» ΟΡΘΟ.
  #
  # ΕΔΩ ΕΙΝΑΙ Η ΤΟΠΟΛΟΓΙΑ, ΟΧΙ ΤΟ TEST:
  #   · user: 11002 = lawmax-producer (ΚΑΡΦΩΜΕΝΟ uid στο
  #     authority-v2/capability/identities.sh — ΙΔΙΑ ταυτότητα host και container)
  #   · ./output ΟΛΟΚΛΗΡΟ ως :ro  ⇒ το releases/ ΚΑΘΕ corpus είναι read-only
  #   · ΜΟΝΟ τα candidates/<corpus> είναι :rw (nested mounts πάνω από το :ro)
  #   · ΚΑΝΕΝΑ mount του authority store (/var/lib/lawmax/authority): ο producer
  #     δεν έχει ΟΥΤΕ ΜΟΝΟΠΑΤΙ προς αυτόν — μηδενική πρόσβαση εξ ορισμού
  #   · read_only rootfs + cap_drop ALL + no-new-privileges
  # Η άρνηση εγγραφής στο releases/ είναι ΤΟΥ ΠΥΡΗΝΑ (EROFS), όχι της εφαρμογής —
  # η ίδια ιδιότητα που αποδεικνύεται εκτελεστικά στο producer-os-boundary-test.sh.
  producer:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: orchestrator:latest
    container_name: lawmax-producer
    user: "11002:11002"
    command: ["--cut-release"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 2g
    cpus: 2.0
    volumes:
      # ΟΛΟ το output ΜΟΝΟ ΓΙΑ ΑΝΑΓΝΩΣΗ — περιλαμβάνει ΚΑΘΕ releases/
      - ./output:/app/output:ro
      - ./configs:/app/configs:ro
      - ./deployment:/app/deployment:ro
      # astikos: ΜΟΝΟ το candidates/ του είναι εγγράψιμο
      - ./output/astikos/candidates:/app/output/astikos/candidates:rw
      # constitution: ΜΟΝΟ το candidates/ του είναι εγγράψιμο
      - ./output/constitution/candidates:/app/output/constitution/candidates:rw
      # kdioikitikis: ΜΟΝΟ το candidates/ του είναι εγγράψιμο
      - ./output/kdioikitikis/candidates:/app/output/kdioikitikis/candidates:rw
      # kpoinikis: ΜΟΝΟ το candidates/ του είναι εγγράψιμο
      - ./output/kpoinikis/candidates:/app/output/kpoinikis/candidates:rw
      # kpolitikis: ΜΟΝΟ το candidates/ του είναι εγγράψιμο
      - ./output/kpolitikis/candidates:/app/output/kpolitikis/candidates:rw
      # poinikos: ΜΟΝΟ το candidates/ του είναι εγγράψιμο
      - ./output/poinikos/candidates:/app/output/poinikos/candidates:rw
    profiles: ["producer"]

  # ═══════════════════════════════════════════════════════════════════════════
  # authority-v2 — ΤΟ ΟΡΙΟ ΠΥΡΗΝΑ ΣΕ CONTAINER (η ίδια ΜΙΑ έδρα με το CI)
  # ═══════════════════════════════════════════════════════════════════════════
  # ΕΥΡΗΜΑ ΔΗΜΙΟΥΡΓΟΥ (P1): «τίποτα δεν είναι συρματωμένο σε Docker/compose».
  # Εδώ τρέχει ΑΚΡΙΒΩΣ το ίδιο script που τρέχει το CI και ο δημιουργός τοπικά —
  # καμία τρίτη διαδρομή, καμία «ειδική έκδοση για container».
  #
  # ΓΙΑΤΙ privileged/CAP_SYS_ADMIN: το όριο ΔΕΝ προσομοιώνεται. Απαιτεί
  # ΠΡΑΓΜΑΤΙΚΟ read-only bind mount σε ιδιωτικό mount namespace και setpriv σε
  # ξεχωριστό uid. Χωρίς αυτά η απόδειξη βγάζει BLOCKED (exit 2) — ΠΟΤΕ pass.
  # ΔΕΝ είναι υπηρεσία παραγωγής: είναι ΕΚΤΕΛΕΣΤΗΣ ΑΠΟΔΕΙΞΕΩΝ, one-shot.
  authority-v2-proofs:
    image: debian:bookworm-slim
    container_name: lawmax-authority-v2-proofs
    working_dir: /repo
    privileged: true
    volumes:
      - .:/repo:rw
    environment:
      - AUTHORITY_V2_REQUIRE_ALL=1
      - LAWMAX_REPO=/repo
    command:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq sbcl python3 util-linux >/dev/null
        for t in sbcl python3 setpriv unshare mount; do
          command -v "$$t" >/dev/null || { echo "::error::ΑΠΟΝ εργαλείο: $$t"; exit 1; }
        done
        bash authority-v2/run-proofs.sh
    profiles: ["proofs"]

networks:
  orchestrator-net:
    driver: bridge

# volumes:
#   postgres-data:
#   redis-data:
